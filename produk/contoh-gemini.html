<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Estimasi Proyek — Produk HTML Gemini</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 sm:p-10 font-sans">
  <div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between gap-4 mb-6">
      <div>
        <span class="inline-block text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 mb-2">
          Contoh Produk HTML dari Gemini
        </span>
        <h1 class="text-2xl sm:text-3xl font-bold text-white">Kalkulator Estimasi Biaya Proyek</h1>
        <p class="text-sm text-slate-400 mt-1">Simulasi cepat perhitungan modul aplikasi & ringkasan penawaran.</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
      <!-- Form Pilih Modul -->
      <div class="md:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <h2 class="font-semibold text-white text-sm uppercase tracking-wider">1. Pilih Komponen Proyek</h2>

        <div class="space-y-2.5 text-sm" id="module-list">
          <label class="flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800 cursor-pointer hover:border-indigo-500/50">
            <span class="flex items-center gap-2.5">
              <input type="checkbox" checked data-price="1500000" onchange="hitung()" class="w-4 h-4 accent-indigo-500" />
              <span>Landing Page & UI Responsif</span>
            </span>
            <span class="font-mono text-indigo-300">Rp 1.500.000</span>
          </label>

          <label class="flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800 cursor-pointer hover:border-indigo-500/50">
            <span class="flex items-center gap-2.5">
              <input type="checkbox" checked data-price="2500000" onchange="hitung()" class="w-4 h-4 accent-indigo-500" />
              <span>Dashboard Admin & Autentikasi</span>
            </span>
            <span class="font-mono text-indigo-300">Rp 2.500.000</span>
          </label>

          <label class="flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800 cursor-pointer hover:border-indigo-500/50">
            <span class="flex items-center gap-2.5">
              <input type="checkbox" data-price="2000000" onchange="hitung()" class="w-4 h-4 accent-indigo-500" />
              <span>Integrasi AI / Gemini API</span>
            </span>
            <span class="font-mono text-indigo-300">Rp 2.000.000</span>
          </label>

          <label class="flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800 cursor-pointer hover:border-indigo-500/50">
            <span class="flex items-center gap-2.5">
              <input type="checkbox" data-price="1200000" onchange="hitung()" class="w-4 h-4 accent-indigo-500" />
              <span>Payment Gateway & Laporan PDF</span>
            </span>
            <span class="font-mono text-indigo-300">Rp 1.200.000</span>
          </label>
        </div>

        <div class="pt-2">
          <label class="block text-xs text-slate-400 mb-1">Diskon Khusus (%)</label>
          <input id="diskon" type="number" min="0" max="50" value="0" oninput="hitung()" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white" />
        </div>
      </div>

      <!-- Ringkasan -->
      <div class="md:col-span-5 bg-gradient-to-b from-indigo-950/60 to-slate-900 border border-indigo-500/30 rounded-2xl p-5 flex flex-col justify-between">
        <div>
          <h2 class="font-semibold text-indigo-300 text-sm uppercase tracking-wider mb-4">2. Ringkasan Estimasi</h2>
          <div class="space-y-3 text-sm">
            <div class="flex justify-between text-slate-300">
              <span>Subtotal Modul</span>
              <span id="subtotal" class="font-mono">Rp 0</span>
            </div>
            <div class="flex justify-between text-emerald-400">
              <span>Potongan Diskon</span>
              <span id="potongan" class="font-mono">- Rp 0</span>
            </div>
            <div class="border-t border-slate-800 pt-3 flex justify-between items-baseline">
              <span class="font-bold text-white">Total Estimasi</span>
              <span id="total" class="text-xl font-extrabold text-indigo-400 font-mono">Rp 0</span>
            </div>
          </div>
        </div>

        <button onclick="salinRingkasan()" id="btn-copy" class="mt-6 w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition">
          Salin Ringkasan Estimasi
        </button>
      </div>
    </div>
  </div>

  <script>
    function formatRupiah(angka) {
      return 'Rp ' + angka.toLocaleString('id-ID');
    }

    function hitung() {
      const checks = document.querySelectorAll('#module-list input[type="checkbox"]:checked');
      let subtotal = 0;
      checks.forEach(c => subtotal += Number(c.dataset.price || 0));
      const diskonPersen = Math.min(50, Math.max(0, Number(document.getElementById('diskon').value || 0)));
      const potongan = Math.round(subtotal * (diskonPersen / 100));
      const total = subtotal - potongan;

      document.getElementById('subtotal').textContent = formatRupiah(subtotal);
      document.getElementById('potongan').textContent = '- ' + formatRupiah(potongan);
      document.getElementById('total').textContent = formatRupiah(total);
    }

    function salinRingkasan() {
      const total = document.getElementById('total').textContent;
      navigator.clipboard.writeText(`Estimasi Biaya Proyek: ${total}`);
      const btn = document.getElementById('btn-copy');
      btn.textContent = 'Tersalin ke Clipboard!';
      setTimeout(() => btn.textContent = 'Salin Ringkasan Estimasi', 2000);
    }

    hitung();
  </script>
</body>
</html>
